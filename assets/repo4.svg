<svg width="440" height="168" viewBox="0 0 440 168" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardbg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="goldline4" x1="-60%" y1="0%" x2="40%" y2="0%">
      <stop offset="0%" stop-color="#5c4914"/>
      <stop offset="45%" stop-color="#f2c14e"/>
      <stop offset="55%" stop-color="#f2c14e"/>
      <stop offset="100%" stop-color="#5c4914"/>
      <animate attributeName="x1" values="-60%;140%;-60%" dur="5s" begin="1.2s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="40%;240%;40%" dur="5s" begin="1.2s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="438" height="166" rx="14" fill="url(#cardbg4)" stroke="#3a3020" stroke-width="1.2"/>
  <rect x="1" y="1" width="438" height="3" rx="1.5" fill="url(#goldline4)"/>

  <text x="24" y="42" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="700" fill="#f2ead2">MultiAgentDebugger</text>

    <text x="24" y="72" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#9c9078">A multi agent system that investigates why a</text>
    <text x="24" y="92" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#9c9078">model is underperforming by examining metrics,</text>
    <text x="24" y="112" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#9c9078">data and features together.</text>

  <circle cx="28" cy="142" r="5" fill="#f2c14e">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
  </circle>
  <text x="40" y="146" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#c9bda0">Python</text>
</svg>